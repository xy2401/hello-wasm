name: build-shell-riscv64-runtimes

on:
  workflow_dispatch:
    inputs:
      runtime:
        description: Shell runtime to build
        required: true
        default: all
        type: choice
        options:
          - all
          - base
          - multi

permissions:
  contents: write

concurrency:
  group: hello-wasm-riscv64-main
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      runtimes: ${{ steps.matrix.outputs.runtimes }}
    steps:
      - id: matrix
        env:
          SELECTED: ${{ inputs.runtime || 'all' }}
        run: |
          if [ "$SELECTED" = all ]; then
            echo 'runtimes=["base","multi"]' >> "$GITHUB_OUTPUT"
          else
            printf 'runtimes=["%s"]\n' "$SELECTED" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runtime: ${{ fromJson(needs.prepare.outputs.runtimes) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64

      - uses: docker/setup-buildx-action@v3

      - name: Install container2wasm
        run: |
          curl -fsSL https://github.com/container2wasm/container2wasm/releases/download/v0.8.4/container2wasm-v0.8.4-linux-amd64.tar.gz | sudo tar -xz -C /usr/local/bin
          sudo chmod +x /usr/local/bin/c2w
          c2w --version

      - name: Build RISC-V 64 Shell image
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: |
          docker buildx build \
            --platform linux/riscv64 \
            --file "runtimes/shell/$RUNTIME/Dockerfile" \
            --tag "hello-wasm-shell-$RUNTIME:rv64" \
            --load .
          if [ "$RUNTIME" = base ]; then
            docker run --rm --platform linux/riscv64 "hello-wasm-shell-$RUNTIME:rv64" \
              sh -lc 'busybox | head -n 1; printf "default shell: "; readlink /bin/sh' | tee runtime-version.txt
          else
            docker run --rm --platform linux/riscv64 "hello-wasm-shell-$RUNTIME:rv64" \
              sh -lc 'bash --version | head -n 1; zsh --version; fish --version' | tee runtime-version.txt
          fi

      - name: Convert and package runtime
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: |
          mkdir -p "out/$RUNTIME" "artifact/docs/public/runtime/shell/$RUNTIME/riscv64"
          c2w \
            --build-arg SOURCE_REPO=https://github.com/container2wasm/container2wasm.git \
            --build-arg SOURCE_REPO_VERSION=v0.8.4 \
            --target-arch=riscv64 \
            "hello-wasm-shell-$RUNTIME:rv64" "out/$RUNTIME/runtime.wasm"
          node scripts/package-runtime.js \
            --input "out/$RUNTIME/runtime.wasm" \
            --dest "artifact/docs/public/runtime/shell/$RUNTIME/riscv64" \
            --family shell \
            --runtime "$RUNTIME" \
            --runtime-version "$(tr '\n' ' ' < runtime-version.txt)" \
            --system-version "Alpine Linux 3.22"

      - uses: actions/upload-artifact@v4
        with:
          name: hello-wasm-shell-${{ matrix.runtime }}
          path: artifact/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: ${{ needs.build.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Remove replaced runtime directories
        env:
          RUNTIMES: ${{ needs.prepare.outputs.runtimes }}
        run: |
          for runtime in $(printf '%s' "$RUNTIMES" | jq -r '.[]'); do
            rm -rf "docs/public/runtime/shell/$runtime/riscv64"
          done

      - uses: actions/download-artifact@v4
        with:
          pattern: hello-wasm-shell-*
          path: .
          merge-multiple: true

      - name: Validate generated assets
        env:
          RUNTIMES: ${{ needs.prepare.outputs.runtimes }}
        run: |
          required=$(printf '%s' "$RUNTIMES" | jq -r 'join(",")')
          node scripts/check-runtimes.js "--require-shell=$required"

      - name: Commit runtime assets
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add docs/public/runtime/shell
          if git diff --cached --quiet; then
            echo 'Shell runtime assets are unchanged.'
            exit 0
          fi
          git commit -m 'chore(runtime): update RISC-V 64 Shell runtimes'
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
